[package]
name = "limecraft-setup"
version = "1.1.4"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = "0.37"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "5"

[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
