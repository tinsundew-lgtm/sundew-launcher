name: release

# Builds LimeCraft for Linux (Linux Mint / Ubuntu) and Windows.
#  - run it by hand: Actions -> release -> Run workflow
#  - or push a tag such as v1.0.0: the files are also attached to a GitHub Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x86_64)
    # Ubuntu 22.04 has the oldest glibc we still care about: the program also
    # runs on Linux Mint 21.x (based on 22.04) and 22.x (based on 24.04).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}

      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          DIR="LimeCraft-${VERSION}-linux-x86_64"
          mkdir -p "$DIR/licenses"
          cp target/release/limecraft-launcher "$DIR/"
          strip "$DIR/limecraft-launcher" || true
          cp assets/icon-256.png "$DIR/limecraft.png"
          cp packaging/linux/limecraft.desktop packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/README-LINUX.md "$DIR/"
          cp README.md CHANGELOG.md LICENSE "$DIR/"
          cp assets/fonts/PHOSPHOR-LICENSE-MIT.txt "$DIR/licenses/Phosphor-Icons-MIT.txt"
          cp assets/fonts/Manrope-OFL.txt "$DIR/licenses/Manrope-OFL.txt"
          chmod +x "$DIR/limecraft-launcher" "$DIR/install.sh" "$DIR/uninstall.sh"
          tar -czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          echo "ARCHIVE=$DIR.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LimeCraft-linux
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $dir = "LimeCraft-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path "$dir/licenses" | Out-Null
          Copy-Item target/release/limecraft-launcher.exe "$dir/LimeCraft-$version.exe"
          Copy-Item README.md, CHANGELOG.md, LICENSE $dir
          Copy-Item assets/fonts/PHOSPHOR-LICENSE-MIT.txt "$dir/licenses/Phosphor-Icons-MIT.txt"
          Copy-Item assets/fonts/Manrope-OFL.txt "$dir/licenses/Manrope-OFL.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower() + "  $dir.zip" | Out-File -Encoding ascii "$dir.zip.sha256"
          "ARCHIVE=$dir.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: LimeCraft-windows
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
