[package]
name = "limecraft-launcher"
version = "1.0.0"
edition = "2024"
description = "LimeCraft - a lightweight Minecraft launcher"
license = "Apache-2.0"

[dependencies]
eframe = "0.37"
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
dirs = "5"
which = "7"
percent-encoding = "2"
hex = "0.4"
rfd = "0.15"
base64 = "0.22"
flate2 = "1"
tar = "0.4"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
